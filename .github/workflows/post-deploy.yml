name: Post-deploy search engine ping
# Runs after every push to main (Vercel deploys main in about 15 to 30 seconds), then submits
# every sitemap URL to IndexNow (Bing, Yandex, Seznam, Naver) and pings Bing. Manual run too.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Vercel to finish the production deploy
        if: github.event_name == 'push'
        run: sleep 90
      - name: Submit sitemap to IndexNow and Bing
        run: node scripts/ping-search-engines.js
